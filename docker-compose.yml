version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psd-booking-postgres
    environment:
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpass
      POSTGRES_DB: bookingdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d bookingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psd-booking-api
    environment:
      PORT: ":3000"
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      API_KEY: ${API_KEY:-your_api_key}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: bookinguser
      DB_PASSWORD: bookingpass
      DB_NAME: bookingdb
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booking-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  booking-network:
    driver: bridge
